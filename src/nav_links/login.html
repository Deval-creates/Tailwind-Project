<body class="min-h-screen bg-blue-950 flex flex-col items-center justify-center p-4">

    <div id="login_form" class="w-full max-w-sm sm:max-w-md h-fit p-6 border-2 border-blue-700 bg-blue-900 rounded-4xl shadow-xl hover:shadow-emerald-400">
        <form class="flex flex-col w-full"> 
            <h1 class="text-rose-50 text-mono text-4xl"><b>Login</b></h1>
            <input type="text" placeholder="user name or email" class="placeholder-blue-300 border-2 mt-6 w-full rounded-2xl border-blue-600 px-3 py-2">
            <input type="password" placeholder="password" class="placeholder-blue-300 border-2 mt-6 w-full rounded-2xl border-blue-600 px-3 py-2">
            <button class="w-full mt-6 border-indigo-400 bg-indigo-600 hover:bg-indigo-500 rounded-4xl text-white py-2">Log In</button>
            <p class="text-white mt-4">Create an account <a href="signup.html" class="underline">Register</a></p>
        </form>
    </div>
