<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../output.css">
</head>
<body class="min-h-screen bg-blue-950 flex flex-col justify-center items-center p-4">
    <a href="../index.html" class="mb-10 text-white "><- Back to Home</a>
    <div id="SignUp_form" class="w-full max-w-sm sm:max-w-md p-6 border-2 border-blue-700 bg-blue-900 rounded-4xl shadow-xl hover:shadow-emerald-400">
        <form class="flex flex-col"> 
            <h1 class="text-rose-50 text-mono text-4xl"><b>Sign Up</b></h1>
            <input type="text" placeholder="User name" class="placeholder-blue-300 border-2 mt-6 w-full rounded-2xl border-blue-600 px-3 py-2">
            <input type="email" placeholder="E-mail" class="placeholder-blue-300 border-2 mt-6 w-full rounded-2xl border-blue-600 px-3 py-2">
            <input type="password" placeholder="Password" class="placeholder-blue-300 border-2 mt-6 w-full rounded-2xl border-blue-600 px-3 py-2">
            <button class="w-full.5 mt-6 border-indigo-400 bg-indigo-600 hover:bg-indigo-500 rounded-4xl text-white py-2">Sign Up</button>
            <p class="text-white mt-4">Already have an account? <a href="login.html" class="underline">Log In</a></p>
        </form>
    </div>
</body>
</html>
